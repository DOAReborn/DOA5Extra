[DOA5Extra]
; 1 = on, 0 = off. Punish Training (F8 / L3 in Training) is always on.
; Hitboxes in Training (F6).
Hitbox=1
; PS4 Critical Burst effect.
OpenBurst=1
; PS4 costumes (transformations, tearing, effects). Needs the PS4 costumes from DOA5Installer.
StatefulCostumes=1
; Breast press on contact, and its PS4 spring.
BustPress=1
PS4Pressure=1
; Music of the console stages.
ConsoleMusic=1
; PS4 "LR" breast motion (Options > BREAST MOTION). Needs SoftEngineLR.d5sd from the PS4 extractor.
SoftEngineLR=1
; PS4 skin (subsurface scattering) and sweat.
SkinSSS=1
; Experimental breast physics tuning.
SoftBody=0
; Main menu banner: Patreon page instead of the DLC store.
PatreonBanner=1
; 1 = writes DOA5Extra.log next to this file (no personal data).
Log=0

[LifeBar]
; Life bar colors: 0 = game, 1 = red (1.1), 2 = red/violet, 3 = red/pink/blue, 4 = red/magenta/indigo, 5 = pink/violet/blue.
Gradient=3

[Hitbox]
; Key: attacks + body -> attacks only -> off (117 = F6). Style 1 = filled, 0 = wireframe. Trainee 1 = fade out.
Touche=117
Style=1
Trainee=1

[StatefulCostumes]
; R1 on a costume toggles both effects.
EnableCostumeDestruction=1
EnableCostumeTransformation=1
AllowNative990015=1
EnableStatefulCostumes=1
EnableNativeTransitionBurst=1
EnableNativeTransitionSound=1
EnableOriginalSchoolgirlParticles=1
; Online lobbies too. Only on your screen: other players don't need it.
EnableOnlineCostumeTrial=1
EnableRollbackCostumes=1

[StatefulCostumesEffects]
SphereAlpha=45
SphereBright=25
RibbonBright=30
CostumePieces=1

[BustPress]
; 1 = all costumes (hits + floor). 1 = floor press in all modes.
AllCostumes=0
AllModes=1

[PS4Pressure]
; 1 = all modes, 0 = LR mode only (like PS4).
AllModes=1

[ConsoleMusic]
Fireworks=1
Azuchi=1
AttackOnTitan=1
; 1 = the 3 tracks in the Music menu.
Menu=1

[ConsoleMusicNames]
Fireworks=Tropical Beat
Azuchi=Look Ahead
AttackOnTitan=Against the mega disastrous blow -Last Round mix-

[SoftBody]
; 1 = PS4 soft presets (needs SoftEngineLR.d5sd). Swing / Deform multiply the game values.
PS4Soft=1
Swing=1
Deform=1

[SoftEngineLR]
; 1 = LR chosen in BREAST MOTION (saved by the game menu).
LR=1

[SkinSSS]
; Blur width (PS4 = 1.0). CloseUpFade 1 = only in close-ups, like PS4.
Width=3.5
CloseUpFade=0
